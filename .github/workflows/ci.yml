name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          locked: true
      - run: pixi run lint
      - run: pixi run ruff format --check
      # No nuclear data in CI: tests that need OPENMC_CROSS_SECTIONS skip themselves.
      - run: pixi run test
